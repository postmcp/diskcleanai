name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: macOS app — build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test
        working-directory: macApp
        run: |
          xcodebuild test -quiet \
            -project DiskCleanAI.xcodeproj \
            -scheme DiskCleanAI \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

  website:
    name: Website — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
